# A self-hosted OpenDC: one server, which also serves the frontend and runs simulations as its own
# subprocesses, and Postgres for what it records. Traces and results are kept on a volume.
#
#   cp .env.example .env            # and set OPENDC_DB_PASSWORD
#   docker compose up -d            # then open http://localhost:8080
#
# docker-compose.s3.yml keeps traces and results in MinIO instead and live progress in Redis, as a
# deployment of several servers would; docker-compose.prod.yml signs people in through Auth0.
name: opendc

services:
  server:
    image: ghcr.io/atlarge-research/opendc-server:${OPENDC_VERSION:-latest}
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENDC_HTTP_PORT:-8080}:8080"
    # Simulations run inside this container, so its limit is what keeps a large one from taking the
    # whole machine. The server takes a quarter of it; launchers share what the two keys below allow.
    mem_limit: ${OPENDC_MEMORY_LIMIT:-4g}
    environment:
      OPENDC_AUTH_MODE: ${OPENDC_AUTH_MODE:-anonymous}
      OPENDC_DB_URL: jdbc:postgresql://postgres:5432/opendc
      OPENDC_DB_USERNAME: opendc
      OPENDC_DB_PASSWORD: ${OPENDC_DB_PASSWORD:?Set OPENDC_DB_PASSWORD in .env}
      OPENDC_DISPATCHER_LOCAL_CORES: ${OPENDC_SIMULATION_CORES:-2}
      OPENDC_DISPATCHER_LOCAL_MEMORY_MB: ${OPENDC_SIMULATION_MEMORY_MB:-2048}
    volumes:
      - server-data:/var/lib/opendc

  postgres:
    image: postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: opendc
      POSTGRES_DB: opendc
      POSTGRES_PASSWORD: ${OPENDC_DB_PASSWORD:?Set OPENDC_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendc -d opendc"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  server-data:
  postgres-data:
