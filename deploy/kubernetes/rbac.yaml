# Exactly what the Kubernetes dispatcher does: create, watch, annotate and delete its Jobs, watch and
# read the logs of their pods, all in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opendc-dispatcher
  namespace: opendc
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opendc-dispatcher
  namespace: opendc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opendc-dispatcher
subjects:
  - kind: ServiceAccount
    name: opendc-server
    namespace: opendc
---
# Optional: reading nodes lets the admin panel report the cluster's capacity. Without this binding
# the dispatcher logs a warning and reports its own ceiling instead; delete both objects to opt out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opendc-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opendc-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opendc-node-reader
subjects:
  - kind: ServiceAccount
    name: opendc-server
    namespace: opendc
