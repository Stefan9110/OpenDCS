# OpenDC on Kubernetes: one server that runs every execution as a Job of the launcher image.
#
#   cp deploy/kubernetes/secrets.example.env deploy/kubernetes/secrets.env   # and fill it in
#   edit deploy/kubernetes/server.env and ingress.yaml for your cluster
#   kubectl apply -k deploy/kubernetes
#
# Postgres and the S3 bucket are expected to exist already, as managed services usually do; Redis,
# which only ever holds live progress, runs here without persistence. See deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opendc

resources:
  - namespace.yaml
  - server.yaml
  - rbac.yaml
  - launcher.yaml
  - redis.yaml
  - ingress.yaml

configMapGenerator:
  - name: opendc-server-config
    envs:
      - server.env

secretGenerator:
  - name: opendc-server-secrets
    envs:
      - secrets.env

# The server and the launcher it starts have to be the same version: the manifest a Job is handed is
# their contract. Pin both here together, and OPENDC_DISPATCHER_KUBERNETES_IMAGE in server.env.
images:
  - name: ghcr.io/atlarge-research/opendc-server
    newTag: latest
