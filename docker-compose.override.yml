# Read by `docker compose` alongside docker-compose.yml when working from a checkout: the server
# image is built from the distribution Gradle produced, and Postgres is reachable from the host.
#
#   ./gradlew :opendc-web:opendc-web-server:installDist
#   docker compose up -d --build
services:
  server:
    image: opendc-server:dev
    build:
      context: .
      dockerfile: opendc-web/opendc-web-server/Dockerfile

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
