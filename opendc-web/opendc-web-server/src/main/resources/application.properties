# REST API
quarkus.rest.path=/api/v1

# Authentication. The default is auth0, so a deployment that configures nothing still requires a
# sign-in. Developer mode makes every request one implicit admin account and is refused outside dev
# and test at startup, so it cannot reach production by way of a stray config value.
%dev.opendc.auth-mode=developer
%test.opendc.auth-mode=developer

# Where simulations run. Every dispatcher reads its own opendc.dispatcher.<kind>.* settings, so
# switching platforms is this key plus that section.
opendc.execution.dispatcher=local

# The launcher is its own program, published separately because the Kubernetes dispatcher runs its
# image directly. The local dispatcher therefore needs to be told where a copy of it is installed;
# a development run and the test suite use the one the build puts under the launcher module.
#
# How much of the machine it may use is left unset, which is half the memory and every core. A
# machine shared with anything else that matters sets opendc.dispatcher.local.memory-mb and cores.
opendc.dispatcher.local.launcher-lib=opendc-web/opendc-web-launcher/build/install/opendc-launcher/lib

# The queue is drained on a timer in a running deployment. A test drives it itself, so that what a
# case exercises is decided by the case rather than by how long it happened to take.
%test.quarkus.scheduler.enabled=false
%test.opendc.dispatcher.local.work-dir=build/test-executions

# Where traces and results are kept. A directory on disk is the default so that a fresh checkout and
# the test suite need nothing installed; a deployment sets kind=s3 and the s3.* keys below, whose
# values belong in the environment rather than in this file.
#
# The S3 backend speaks to any S3-compatible provider, not only AWS. For a third party, set
# s3.endpoint to theirs and leave s3.path-style at its default: those endpoints generally address a
# bucket as endpoint/bucket, where the SDK would otherwise reach for bucket.endpoint. A launcher
# reading from or writing to a bucket needs credentials of its own, so s3 belongs with a dispatcher
# that can give its jobs some.
opendc.storage.kind=local
opendc.storage.directory=data
%test.opendc.storage.directory=build/test-storage

quarkus.http.limits.max-body-size=1G

# CORS is only needed when the browser and the API are on different origins: the production SaaS
# story (frontend at app.opendc.org, API at api.opendc.org) and dev, where Next serves the frontend
# on port 3000 while this port serves the API. A self-host deployment needs neither, because there
# Quinoa serves the built frontend from this port.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=${OPENDC_CORS_ORIGINS:https://app.opendc.org}

# In dev, open the frontend on http://localhost:3000, NOT through this port. Quinoa's dev proxy
# reads each upstream response in full before forwarding it, and Next 16's App Router needs the
# document to arrive in progressive flushes: hydrate() awaits the RSC flight stream, and that
# stream is closed on DOMContentLoaded. Buffered, the two never meet, so hydrateRoot is never
# called. The page shows its server-rendered HTML and then does nothing, with no console error and
# no request to the API. Bisected with three proxies in front of the same dev server: a transparent
# TCP relay hydrates, a buffering one does not, holding headers and chunked framing constant. The
# buffering is WebClient.send() in QuinoaDevProxyHandler, present on main as well as 2.8.1, so no
# upgrade or setting avoids it. Browsing :3000 skips the proxy while Quinoa still runs the process.
quarkus.quinoa.ui-dir=../opendc-web-frontend
quarkus.quinoa.build-dir=out
quarkus.quinoa.package-manager=pnpm
%dev.quarkus.quinoa.dev-server.port=3000
%dev.quarkus.quinoa.dev-server.logs=true

%dev.quarkus.quinoa.dev-server.check-timeout=120000
%test.quarkus.quinoa.enabled=false

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc-test;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${OPENDC_DB_USERNAME}
%prod.quarkus.datasource.password=${OPENDC_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${OPENDC_DB_URL}

# Hibernate. Schema validation only runs against the real dialect; on H2 the jsonb alias would trip it.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true

# OpenAPI and Swagger
quarkus.smallrye-openapi.info-title=OpenDC REST API
%dev.quarkus.smallrye-openapi.info-title=OpenDC REST API (development)
quarkus.smallrye-openapi.info-version=3.0
quarkus.smallrye-openapi.info-description=OpenDC is an open-source datacenter simulator for education and research.
quarkus.smallrye-openapi.info-contact-email=opendc@atlarge-research.com
quarkus.smallrye-openapi.info-contact-name=OpenDC Support
quarkus.smallrye-openapi.info-contact-url=https://opendc.org
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://github.com/atlarge-research/opendc/blob/master/LICENSE.txt
quarkus.swagger-ui.path=docs
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.category."org.opendc".level=INFO
quarkus.log.category."org.apache".level=WARN
