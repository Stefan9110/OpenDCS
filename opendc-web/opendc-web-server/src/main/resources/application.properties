# REST API
quarkus.rest.path=/api/v1

# Authentication defaults to auth0. Anonymous mode makes every request one implicit administrator.
%dev.opendc.auth.mode=anonymous
%test.opendc.auth.mode=anonymous

# Auth0 tokens are verified by Quarkus OIDC; the server refuses to start when tenant and mode disagree:
#   OPENDC_AUTH_MODE=auth0 QUARKUS_OIDC_TENANT_ENABLED=true
#   QUARKUS_OIDC_AUTH_SERVER_URL=https://<tenant>/ QUARKUS_OIDC_TOKEN_AUDIENCE=<API identifier>
#   OPENDC_AUTH_AUTH0_CLIENT_ID=<SPA client id> OPENDC_AUTH_ADMINS=<subjects of the first admins>
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.subject-required=true
# Both would reach for a container.
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# Every endpoint needs a signed-in person unless it says otherwise, so a new one fails closed.
quarkus.security.jaxrs.default-roles-allowed=user

# Where simulations run: local, kubernetes or slurm, each configured under opendc.dispatcher.<kind>.*
# (see Dispatch.kt). Kubernetes needs s3 storage and a telemetry URL its pods can reach; SLURM jobs
# reach only their shared filesystem, so a slurm run shows no live progress.
opendc.execution.dispatcher=local

# Where the launcher distribution is installed, for dispatchers that start it from files. The local
# dispatcher uses every core and half the memory unless opendc.dispatcher.local.* says otherwise.
opendc.dispatcher.launcher-lib=opendc-web/opendc-web-launcher/build/install/opendc-launcher/lib

# DAS-5, activated with QUARKUS_PROFILE=prod,das5, through the VU bastion; both host keys must be in
# the known-hosts file. Check the node memory with sinfo before relying on it.
%das5.opendc.execution.dispatcher=slurm
%das5.opendc.dispatcher.slurm.host=fs0.das5.cs.vu.nl
%das5.opendc.dispatcher.slurm.user=${OPENDC_SLURM_USER}
%das5.opendc.dispatcher.slurm.jump-host=${OPENDC_VUNET_ID}@ssh.data.vu.nl
%das5.opendc.dispatcher.slurm.identity-file=${OPENDC_SLURM_IDENTITY_FILE}
%das5.opendc.dispatcher.slurm.known-hosts=${OPENDC_SLURM_KNOWN_HOSTS}
%das5.opendc.dispatcher.slurm.remote-root=/var/scratch/${OPENDC_SLURM_USER}/opendc
%das5.opendc.dispatcher.slurm.java=/var/scratch/${OPENDC_SLURM_USER}/opendc/jdk-21/bin/java
%das5.opendc.dispatcher.slurm.partition=defq
%das5.opendc.dispatcher.slurm.slot-cores=16
%das5.opendc.dispatcher.slurm.slot-memory-mb=56000
%das5.opendc.dispatcher.slurm.time-cap=PT15M
%das5.opendc.dispatcher.slurm.max-jobs=4
%das5.opendc.execution.retry.max-memory-request-mb=56000

# Tests drive the queue themselves rather than by timer.
%test.quarkus.scheduler.enabled=false
%test.opendc.dispatcher.local.work-dir=build/test-executions
%test.opendc.execution.launch-retry-delay=PT0S

# Has to be reachable from wherever the launcher runs; the default suits a launcher beside the server.
opendc.execution.telemetry-url=http://localhost:${quarkus.http.port:8080}${quarkus.rest.path}/telemetry

# Live samples are disposable. Redis is what several servers share; memory needs nothing installed.
# Dev Services stay off in every profile: the build matrix has Windows runners with no containers.
opendc.telemetry.kind=memory
quarkus.redis.devservices.enabled=false

# Traces and results live on disk by default; a deployment sets kind=s3 and the opendc.storage.s3.*
# keys from the environment. For a non-AWS provider set s3.endpoint and keep s3.path-style's default.
opendc.storage.kind=local
opendc.storage.directory=data
%test.opendc.storage.directory=build/test-storage

quarkus.http.limits.max-body-size=1G

# Imports refuse private, loopback and link-local hosts by default; the test suite serves from loopback.
%test.opendc.traces.import.allow-private-hosts=true

# A distribution serves the frontend from this origin, so CORS is only for `pnpm dev` on port 3000.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc-test;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${OPENDC_DB_USERNAME}
%prod.quarkus.datasource.password=${OPENDC_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${OPENDC_DB_URL}

# Schema validation only runs against the real dialect; on H2 the jsonb alias would trip it.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true

# OpenAPI and Swagger
quarkus.smallrye-openapi.info-title=OpenDC REST API
%dev.quarkus.smallrye-openapi.info-title=OpenDC REST API (development)
quarkus.smallrye-openapi.info-version=3.0
quarkus.smallrye-openapi.info-description=OpenDC is an open-source datacenter simulator for education and research.
quarkus.smallrye-openapi.info-contact-email=opendc@atlarge-research.com
quarkus.smallrye-openapi.info-contact-name=OpenDC Support
quarkus.smallrye-openapi.info-contact-url=https://opendc.org
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://github.com/atlarge-research/opendc/blob/master/LICENSE.txt
quarkus.swagger-ui.path=docs
quarkus.swagger-ui.always-include=true

# /q/health and /q/metrics are served on management port 9000, never behind the app's ingress.
quarkus.management.enabled=true

# Logging
quarkus.log.category."org.opendc".level=INFO
quarkus.log.category."org.apache".level=WARN
