# REST API
quarkus.rest.path=/api/v1

# Authentication. The default is auth0, so a deployment that configures nothing still requires a
# sign-in. Developer mode makes every request one implicit admin account and is refused outside dev
# and test at startup, so it cannot reach production by way of a stray config value.
%dev.opendc.auth-mode=developer
%test.opendc.auth-mode=developer

# Where the files a trace is made of are kept, addressed by the hash of their contents. A directory
# on disk is the default so that a fresh checkout and the test suite need nothing installed; a
# deployment sets kind=s3 and the s3.* keys below, whose values belong in the environment rather
# than in this file.
#
# The S3 backend speaks to any S3-compatible provider, not only AWS. For a third party, set
# s3.endpoint to theirs and leave s3.path-style at its default: those endpoints generally address a
# bucket as endpoint/bucket, where the SDK would otherwise reach for bucket.endpoint.
opendc.trace-store.kind=local
opendc.trace-store.directory=data/traces
%test.opendc.trace-store.directory=build/test-traces

# CORS is only needed when the browser and the API are on different origins: the production SaaS
# story (frontend at app.opendc.org, API at api.opendc.org) and running the frontend standalone on
# port 3000. Under quarkusDev and in a self-host deployment Quinoa serves both from this port.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.enabled=true
%prod.quarkus.http.cors.origins=${OPENDC_CORS_ORIGINS:https://app.opendc.org}

# Quinoa owns the frontend: it builds the static export for production and, in dev, starts the Next
# dev server so one `quarkusDev` runs everything.
#
# In dev, open the frontend on http://localhost:3000 and NOT through this port. Proxying Next 16's
# App Router through Quinoa serves byte-identical HTML with every chunk returning 200, but the page
# never hydrates: no React roots attach, so the app issues no API calls and sits on a spinner with
# no error anywhere. Browsing :3000 directly avoids the proxy while Quinoa still manages the
# process. Dev is then split-origin, which matches the production deployment
# (app.opendc.org calling api.opendc.org) more closely than the proxy did.
quarkus.quinoa.ui-dir=../opendc-web-frontend
quarkus.quinoa.build-dir=out
quarkus.quinoa.package-manager=pnpm
%dev.quarkus.quinoa.dev-server.port=3000
%dev.quarkus.quinoa.dev-server.logs=true
# Next with turbopack can take a while to answer on a cold start, well past the 30s default.
%dev.quarkus.quinoa.dev-server.check-timeout=120000
# Tests must never build or spawn the frontend.
%test.quarkus.quinoa.enabled=false

# Datasource. Dev and test run on in-memory H2 so that neither local builds nor CI need Docker
# (the CI matrix includes Windows runners without it). H2 has no "jsonb" type name, only "json",
# so the INIT statement aliases it for the shared Flyway baseline. Plain H2 mode is deliberate:
# H2 uppercases unquoted identifiers, so "jsonb" in DDL resolves to the quoted "JSONB" alias,
# while PostgreSQL compatibility mode would fold it to lowercase and miss. Postgres is the
# production database; migrations must stay portable across both dialects.
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc-test;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${OPENDC_DB_USERNAME}
%prod.quarkus.datasource.password=${OPENDC_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${OPENDC_DB_URL}

# Hibernate. Schema validation only runs against the real dialect; on H2 the jsonb alias would
# trip it.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=true

# Flyway
quarkus.flyway.migrate-at-start=true

# OpenAPI and Swagger
quarkus.smallrye-openapi.info-title=OpenDC REST API
%dev.quarkus.smallrye-openapi.info-title=OpenDC REST API (development)
quarkus.smallrye-openapi.info-version=3.0
quarkus.smallrye-openapi.info-description=OpenDC is an open-source datacenter simulator for education and research.
quarkus.smallrye-openapi.info-contact-email=opendc@atlarge-research.com
quarkus.smallrye-openapi.info-contact-name=OpenDC Support
quarkus.smallrye-openapi.info-contact-url=https://opendc.org
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://github.com/atlarge-research/opendc/blob/master/LICENSE.txt
quarkus.swagger-ui.path=docs
quarkus.swagger-ui.always-include=true

# Logging
quarkus.log.category."org.opendc".level=INFO
quarkus.log.category."org.apache".level=WARN