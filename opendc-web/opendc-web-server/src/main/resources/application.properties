# REST API
quarkus.rest.path=/api/v1

# Authentication. The default is auth0, so a deployment that configures nothing still requires a
# sign-in. Anonymous mode makes every request one implicit administrator account; a deployment may
# opt into it for a single person running OpenDC for themselves, and is warned at boot when it does.
%dev.opendc.auth.mode=anonymous
%test.opendc.auth.mode=anonymous

# Auth0 access tokens are verified by Quarkus OIDC as a bearer-only service. The tenant is off unless
# a deployment turns it on with the mode, and the server refuses to start when the two disagree:
#   OPENDC_AUTH_MODE=auth0 QUARKUS_OIDC_TENANT_ENABLED=true
#   QUARKUS_OIDC_AUTH_SERVER_URL=https://<tenant>/ QUARKUS_OIDC_TOKEN_AUDIENCE=<API identifier>
#   OPENDC_AUTH_AUTH0_CLIENT_ID=<SPA client id> OPENDC_AUTH_ADMINS=<subjects of the first admins>
# Personal access tokens and launcher tokens (odc_...) are ours and work in either mode.
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=service
quarkus.oidc.token.subject-required=true
# Both would reach for a container, and OIDC's turns itself on exactly where no Docker is found.
quarkus.oidc.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false

# Every endpoint needs a signed-in person unless it says otherwise, so a new one fails closed.
quarkus.security.jaxrs.default-roles-allowed=user

# Where simulations run: local, kubernetes or slurm. Every dispatcher reads its own
# opendc.dispatcher.<kind>.* settings, so switching platforms is this key plus that section.
#
# On Kubernetes each execution is one Job running the launcher image, which has to be the version of
# this server. Its pods read their inputs through signed URLs and report to the telemetry URL, so the
# server refuses to start on kubernetes with local storage or a loopback telemetry address. The Job
# shape is opendc.dispatcher.kubernetes.slot-cores and slot-memory-mb; see Dispatch.kt for the rest.
#
# On SLURM each execution is one batch job submitted over SSH. Compute nodes reach nothing but their
# shared filesystem, so this server stages the launcher, the traces and a rewritten manifest there,
# and copies each finished unit back itself. A slurm run shows no live progress for that reason.
opendc.execution.dispatcher=local

# The launcher is its own program, published separately because the Kubernetes dispatcher runs its
# image directly. A dispatcher that starts it from files therefore needs to be told where a copy of
# it is installed; a development run and the test suite use the one the build puts under the
# launcher module.
#
# How much of the machine the local dispatcher may use is left unset, which is half the memory and
# every core. A machine shared with anything else that matters sets opendc.dispatcher.local.memory-mb
# and cores.
opendc.dispatcher.launcher-lib=opendc-web/opendc-web-launcher/build/install/opendc-launcher/lib

# DAS-5, activated with QUARKUS_PROFILE=prod,das5. The head node is reached through the VU bastion,
# and both host keys have to be in the known-hosts file. The operator installs a Java 21 runtime
# under the remote root. Jobs are held to the 15-minute daytime limit on 16-core nodes; the node
# memory is an assumption to check with sinfo before relying on it.
%das5.opendc.execution.dispatcher=slurm
%das5.opendc.dispatcher.slurm.host=fs0.das5.cs.vu.nl
%das5.opendc.dispatcher.slurm.user=${OPENDC_SLURM_USER}
%das5.opendc.dispatcher.slurm.jump-host=${OPENDC_VUNET_ID}@ssh.data.vu.nl
%das5.opendc.dispatcher.slurm.identity-file=${OPENDC_SLURM_IDENTITY_FILE}
%das5.opendc.dispatcher.slurm.known-hosts=${OPENDC_SLURM_KNOWN_HOSTS}
%das5.opendc.dispatcher.slurm.remote-root=/var/scratch/${OPENDC_SLURM_USER}/opendc
%das5.opendc.dispatcher.slurm.java=/var/scratch/${OPENDC_SLURM_USER}/opendc/jdk-21/bin/java
%das5.opendc.dispatcher.slurm.partition=defq
%das5.opendc.dispatcher.slurm.slot-cores=16
%das5.opendc.dispatcher.slurm.slot-memory-mb=56000
%das5.opendc.dispatcher.slurm.time-cap=PT15M
%das5.opendc.dispatcher.slurm.max-jobs=4
%das5.opendc.execution.retry.max-memory-request-mb=56000

# The queue is drained on a timer in a running deployment. A test drives it itself, so that what a
# case exercises is decided by the case rather than by how long it happened to take.
%test.quarkus.scheduler.enabled=false
%test.opendc.dispatcher.local.work-dir=build/test-executions
%test.opendc.execution.launch-retry-delay=PT0S

# Where a launcher posts its progress. It has to be an address reachable from wherever the launcher
# runs rather than from this server, so a deployment whose work leaves the machine sets its own
# public URL here. The default suits a launcher started beside the server.
opendc.execution.telemetry-url=http://localhost:${quarkus.http.port:8080}${quarkus.rest.path}/telemetry

# Where live samples are kept while a run is going. They are disposable by design: what a run finally
# produced is its parquet, and anything that has to outlive it is in Postgres. Redis is what a
# deployment of several servers shares; memory is the default so a fresh checkout needs nothing
# installed.
#
# Dev Services are switched off for every profile, not only test: they would reach for a container,
# and the build matrix includes Windows runners that have none.
opendc.telemetry.kind=memory
quarkus.redis.devservices.enabled=false

# Where traces and results are kept. A directory on disk is the default so that a fresh checkout and
# the test suite need nothing installed; a deployment sets kind=s3 and the s3.* keys below, whose
# values belong in the environment rather than in this file.
#
# The S3 backend speaks to any S3-compatible provider, not only AWS. For a third party, set
# s3.endpoint to theirs and leave s3.path-style at its default: those endpoints generally address a
# bucket as endpoint/bucket, where the SDK would otherwise reach for bucket.endpoint. A launcher
# reading from or writing to a bucket needs credentials of its own, so s3 belongs with a dispatcher
# that can give its jobs some.
opendc.storage.kind=local
opendc.storage.directory=data
%test.opendc.storage.directory=build/test-storage

quarkus.http.limits.max-body-size=1G

# Traces imported from a URL are fetched by this server, so by default it refuses any URL whose host
# is a private, loopback or link-local address. A deployment importing from its own intranet sets
# opendc.traces.import.allow-private-hosts=true; max-bytes (per table, 10 GiB) and deadline (PT6H)
# bound each import. The test suite serves its files from loopback.
%test.opendc.traces.import.allow-private-hosts=true

# A distribution serves the frontend's static export from this port (opendc.frontend.directory, set
# in its config/), so the browser and the API share an origin and CORS stays off. In dev, run the
# frontend with `pnpm dev` on port 3000 against this server, which is the one cross-origin case. A
# deployment that hosts the export elsewhere enables CORS itself with QUARKUS_HTTP_CORS_ENABLED and
# QUARKUS_HTTP_CORS_ORIGINS.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:opendc-test;DB_CLOSE_DELAY=-1;INIT=CREATE TYPE IF NOT EXISTS "JSONB" AS json
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${OPENDC_DB_USERNAME}
%prod.quarkus.datasource.password=${OPENDC_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${OPENDC_DB_URL}

# Hibernate. Schema validation only runs against the real dialect; on H2 the jsonb alias would trip it.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.migrate-at-start=true

# OpenAPI and Swagger
quarkus.smallrye-openapi.info-title=OpenDC REST API
%dev.quarkus.smallrye-openapi.info-title=OpenDC REST API (development)
quarkus.smallrye-openapi.info-version=3.0
quarkus.smallrye-openapi.info-description=OpenDC is an open-source datacenter simulator for education and research.
quarkus.smallrye-openapi.info-contact-email=opendc@atlarge-research.com
quarkus.smallrye-openapi.info-contact-name=OpenDC Support
quarkus.smallrye-openapi.info-contact-url=https://opendc.org
quarkus.smallrye-openapi.info-license-name=MIT
quarkus.smallrye-openapi.info-license-url=https://github.com/atlarge-research/opendc/blob/master/LICENSE.txt
quarkus.swagger-ui.path=docs
quarkus.swagger-ui.always-include=true

# Health checks (/q/health) and Prometheus metrics (/q/metrics) are served on a management port of
# their own, 9000, so neither is ever behind the ingress that serves the app. Only API requests are
# timed: static asset paths would multiply the series.
quarkus.management.enabled=true
quarkus.micrometer.binder.http-server.ignore-patterns=/(?!api/).*

# Logging
quarkus.log.category."org.opendc".level=INFO
quarkus.log.category."org.apache".level=WARN
