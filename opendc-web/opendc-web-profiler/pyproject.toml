[project]
name = "opendc-profiler-plots"
version = "0.1.0"
description = "Figures from the opendc-web profiler's measurements"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[project.scripts]
opendc-profiler-plots = "opendc_profiler_plots.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main/python/opendc_profiler_plots"]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
